---
# Crée le secret dockerhub-creds sur le cluster workloads (84.234.26.236)
# pour permettre le pull d'images privées Docker Hub.
#
# Pré-requis :
#   - kubernetes.core installé : ansible-galaxy collection install kubernetes.core
#   - kubeconfig du cluster workloads accessible sur le nœud cible
#
# Exemple :
#   cd ansible
#   ansible-playbook -i envs/workload/00_inventory.yml dockerhub-secret.yml \
#     -e dockerhub_username=andr7w \
#     -e dockerhub_password=dckr_pat_XXXXXXXXXX

- name: Docker Hub — créer le secret pull images privées
  hosts: k8s_master
  become: true
  roles:
    - dockerhub_secret
