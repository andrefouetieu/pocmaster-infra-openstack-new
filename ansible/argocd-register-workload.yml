---
# Enregistre le cluster workloads (saga-workload-dev) dans Argo CD.
# S'exécute sur le cluster Argo CD (platform k8s_master = 84.234.25.73).
#
# Pré-requis sur le cluster workloads (84.234.26.236) :
#   1. Créer le ServiceAccount argocd-manager (voir GUIDE_CONFIGURATION_ARGOCD.md Phase 3.1-3.2)
#   2. Récupérer le token et la CA (Phase 3.3) et les passer en -e ci-dessous
#
# Exemple :
#   cd ansible
#   ansible-playbook -i envs/platform/00_inventory.yml argocd-register-workload.yml \
#     -e saga_gitops_repo_root=/Users/mac/IdeaProjects/saga-orchestration-case-study \
#     -e workload_bearer_token=eyJhbGciOiJS... \
#     -e workload_ca_data=LS0tLS1CRUdJTi...

- name: Argo CD — enregistrer le cluster workloads saga-workload-dev
  hosts: k8s_master
  become: true
  roles:
    - argocd_register_cluster
