---
# Copie tools/vault/ sur le master et exécute install.sh (source unique)
- name: Copy tools/vault to remote
  ansible.builtin.copy:
    src: "{{ vault_install_src }}"
    dest: "{{ vault_install_dest }}"
    mode: "0644"

- name: Make install.sh executable
  ansible.builtin.file:
    path: "{{ vault_install_dest }}/install.sh"
    mode: "0755"

- name: Run Vault install script
  ansible.builtin.shell: ./install.sh
  args:
    chdir: "{{ vault_install_dest }}"
  environment:
    KUBECONFIG: "{{ ansible_user_dir }}/.kube/config"
  register: _vault_install
  changed_when: true

- name: Cleanup temp install directory
  ansible.builtin.file:
    path: "{{ vault_install_dest }}"
    state: absent

- name: Show Vault access info
  ansible.builtin.debug:
    msg: "Vault installé. UI/API via NodePort {{ vault_node_port }} sur les nœuds du cluster."
