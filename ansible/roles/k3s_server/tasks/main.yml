---
- name: Install dependencies
  ansible.builtin.apt:
    name: [curl, ca-certificates]
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install K3s server
  ansible.builtin.shell: |
    set -e
    curl -sfL {{ k3s_install_url }} | {{ 'INSTALL_K3S_VERSION=' + k3s_version + ' ' if k3s_version else '' }}sh -s - server
  args:
    creates: /usr/local/bin/k3s
  register: _k3s_install

- name: Wait for K3s server to be ready
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    state: present
    timeout: 120

- name: Read node token for joining agents
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: _k3s_token_file

- name: Expose K3s node token as fact for agent play
  ansible.builtin.set_fact:
    k3s_node_token: "{{ _k3s_token_file.content | b64decode }}"
