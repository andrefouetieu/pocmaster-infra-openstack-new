---
- name: Exiger saga_gitops_repo_root
  ansible.builtin.assert:
    that:
      - saga_gitops_repo_root is defined
      - (saga_gitops_repo_root | string | length) > 0
    fail_msg: >-
      Definir -e saga_gitops_repo_root=/chemin/vers/saga-orchestration-case-study

- name: Exiger workload_bearer_token
  ansible.builtin.assert:
    that:
      - workload_bearer_token is defined
      - (workload_bearer_token | string | length) > 0
    fail_msg: >-
      Definir -e workload_bearer_token=eyJhbG...
      (token du SA argocd-manager sur le cluster workloads)

- name: Exiger workload_ca_data
  ansible.builtin.assert:
    that:
      - workload_ca_data is defined
      - (workload_ca_data | string | length) > 0
    fail_msg: >-
      Definir -e workload_ca_data=LS0tLS1C...
      (CA base64 du cluster workloads)

- name: Verifier le template cluster-secret sur le controller
  ansible.builtin.stat:
    path: "{{ saga_gitops_repo_root }}/argocd/bootstrap/cluster-secret-saga-workload-dev.yaml.template"
  delegate_to: localhost
  become: false
  register: _cluster_secret_tpl
  failed_when: not _cluster_secret_tpl.stat.exists

- name: Repertoire de staging sur le master Argo CD
  ansible.builtin.file:
    path: "{{ argocd_register_staging_dir }}"
    state: directory
    mode: "0755"

- name: Copier le template cluster-secret vers le master Argo CD
  ansible.builtin.copy:
    src: "{{ saga_gitops_repo_root }}/argocd/bootstrap/cluster-secret-saga-workload-dev.yaml.template"
    dest: "{{ argocd_register_staging_dir }}/cluster-secret-saga-workload-dev.yaml.template"
    mode: "0600"

- name: Executer le script d'enregistrement du cluster workloads
  ansible.builtin.script: "{{ playbook_dir }}/../scripts/argocd-register-workload-cluster.sh"
  environment:
    SAGA_BOOTSTRAP_DIR: "{{ argocd_register_staging_dir }}"
    ARGOCD_NAMESPACE: "{{ argocd_namespace }}"
    WORKLOAD_BEARER_TOKEN: "{{ workload_bearer_token }}"
    WORKLOAD_CA_DATA: "{{ workload_ca_data }}"
  changed_when: true

- name: Nettoyer le repertoire de staging
  ansible.builtin.file:
    path: "{{ argocd_register_staging_dir }}"
    state: absent
