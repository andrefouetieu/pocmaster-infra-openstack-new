# Values pour le chart Helm Bitnami MongoDB.
# Architecture : replica set (2 nœuds données + 1 arbiter pour le quorum).
# Personnaliser selon l'environnement (dev, prod).

image:
  registry: docker.io
  repository: bitnami/mongodb
  tag: latest
  debug: true

architecture: replicaset

replicaCount: 2

arbiter:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

auth:
  enabled: true
  rootUser: admin
  rootPassword: "mongopAss123!"
  replicaSetKey: "mongoSet123!"
  # Custom user et base créés à l'initialisation.
  usernames:
    - myappuser
  passwords:
    - myappPass123!
  databases:
    - myappdb
  # En prod, utiliser existingSecret :
  # existingSecret: mongodb-root-secret

persistence:
  enabled: true
  size: 1Gi
  # storageClass: ""  # Laisser vide pour la StorageClass par défaut

service:
  type: NodePort
  nodePorts:
    mongodb: 30017

externalAccess:
  enabled: false

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 20
  timeoutSeconds: 10
  failureThreshold: 6
readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
