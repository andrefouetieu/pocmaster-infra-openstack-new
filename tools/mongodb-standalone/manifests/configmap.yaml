apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init-scripts
  namespace: mongodb
data:
  init-users.js: |
    // Script d'initialisation : crée un utilisateur applicatif avec accès à myappdb.
    // Exécuté une seule fois au premier démarrage (si /data/db est vide).
    const appUser = process.env.MONGO_APP_USERNAME;
    const appPassword = process.env.MONGO_APP_PASSWORD;
    const appDatabase = process.env.MONGO_APP_DATABASE;

    db = db.getSiblingDB(appDatabase);
    db.createUser({
      user: appUser,
      pwd: appPassword,
      roles: [
        { role: "readWrite", db: appDatabase },
        { role: "dbAdmin", db: appDatabase }
      ]
    });
    print("Utilisateur " + appUser + " créé sur la base " + appDatabase);
